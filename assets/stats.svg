<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <linearGradient id="steleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6e29" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <filter id="steleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <style>
      .st-title { font-family: 'Cinzel', 'Noto Serif SC', 'Songti SC', serif; }
      .st-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes runeBreathe {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #ffd700); }
      }
      .runeActive { animation: runeBreathe 4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Stele Stone Container -->
  <rect x="15" y="15" width="920" height="330" rx="8" fill="url(#steleBg)" stroke="#3a3020" stroke-width="1.4" filter="url(#steleShadow)" />

  <!-- Corner Accents -->
  <g stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.65">
    <path d="M 25 45 L 25 25 L 45 25" />
    <path d="M 925 45 L 925 25 L 905 25" />
    <path d="M 25 315 L 25 335 L 45 335" />
    <path d="M 925 315 L 925 335 L 905 335" />
  </g>

  <!-- Header Section -->
  <g text-anchor="middle" class="st-title">
    <text x="475" y="52" fill="#d4af37" font-size="12" letter-spacing="4" opacity="0.9" class="runeActive">
      CORE ENGINEERING FOCUS &amp; PROFICIENCIES
    </text>
    <text x="475" y="78" fill="#f4f0eb" font-size="18" font-weight="600" letter-spacing="3">
      TECHNICAL FOCUS &amp; ACADEMIC PROFILE
    </text>
  </g>

  <line x1="50" y1="94" x2="900" y2="94" stroke="#332a1e" stroke-width="1" />

  <!-- Left Column: Focus Bars -->
  <g transform="translate(50, 115)">
    <text x="0" y="15" fill="#e6dfd3" font-size="13" font-weight="600" class="st-body">Object-Oriented Design &amp; Systems Architecture</text>
    <text x="400" y="15" text-anchor="end" fill="#ffd700" font-size="12" font-weight="600" class="st-body">Java / C++ · Core</text>
    <rect x="0" y="24" width="400" height="8" rx="4" fill="#1a1d26" stroke="#2a2316" stroke-width="1" />
    <rect x="0" y="24" width="352" height="8" rx="4" fill="url(#goldBar)" />

    <text x="0" y="65" fill="#e6dfd3" font-size="13" font-weight="600" class="st-body">Data Engineering &amp; Relational Storage</text>
    <text x="400" y="65" text-anchor="end" fill="#ffd700" font-size="12" font-weight="600" class="st-body">SQL / PostgreSQL / Pandas</text>
    <rect x="0" y="74" width="400" height="8" rx="4" fill="#1a1d26" stroke="#2a2316" stroke-width="1" />
    <rect x="0" y="74" width="328" height="8" rx="4" fill="url(#goldBar)" />

    <text x="0" y="115" fill="#e6dfd3" font-size="13" font-weight="600" class="st-body">Backend Frameworks &amp; RESTful APIs</text>
    <text x="400" y="115" text-anchor="end" fill="#ffd700" font-size="12" font-weight="600" class="st-body">Spring Boot / FastAPI / Express</text>
    <rect x="0" y="124" width="400" height="8" rx="4" fill="#1a1d26" stroke="#2a2316" stroke-width="1" />
    <rect x="0" y="124" width="320" height="8" rx="4" fill="url(#goldBar)" />

    <text x="0" y="165" fill="#e6dfd3" font-size="13" font-weight="600" class="st-body">Linux Environments &amp; Containerization</text>
    <text x="400" y="165" text-anchor="end" fill="#ffd700" font-size="12" font-weight="600" class="st-body">Docker / Git / Bash</text>
    <rect x="0" y="174" width="400" height="8" rx="4" fill="#1a1d26" stroke="#2a2316" stroke-width="1" />
    <rect x="0" y="174" width="312" height="8" rx="4" fill="url(#goldBar)" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="490" y1="115" x2="490" y2="315" stroke="#332a1e" stroke-width="1" />

  <!-- Right Column: Metadata Cards -->
  <g transform="translate(525, 115)" class="st-body">
    <g transform="translate(0, 0)">
      <rect width="375" height="44" rx="5" fill="#121620" stroke="#3a3020" stroke-width="1" />
      <text x="16" y="20" fill="#d4af37" font-size="11" class="st-title">ACADEMIC INSTITUTION</text>
      <text x="16" y="35" fill="#f4f0eb" font-size="12.5" font-weight="600">Hanoi University of Science and Technology (HUST)</text>
      <text x="360" y="28" text-anchor="end" fill="#a69c8c" font-size="11">K68 · CS</text>
    </g>

    <g transform="translate(0, 52)">
      <rect width="375" height="44" rx="5" fill="#121620" stroke="#3a3020" stroke-width="1" />
      <text x="16" y="20" fill="#d4af37" font-size="11" class="st-title">PRIMARY SPECIALIZATION</text>
      <text x="16" y="35" fill="#f4f0eb" font-size="12.5" font-weight="600">Backend Systems &amp; Data Engineering</text>
      <text x="360" y="28" text-anchor="end" fill="#ffd700" font-size="11">Active</text>
    </g>

    <g transform="translate(0, 104)">
      <rect width="375" height="44" rx="5" fill="#121620" stroke="#3a3020" stroke-width="1" />
      <text x="16" y="20" fill="#d4af37" font-size="11" class="st-title">CODEBASE REPOSITORY</text>
      <text x="16" y="35" fill="#f4f0eb" font-size="12.5" font-weight="600">github.com/m0n4rcz</text>
      <text x="360" y="28" text-anchor="end" fill="#a69c8c" font-size="11">Verified</text>
    </g>

    <g transform="translate(0, 156)">
      <rect width="375" height="44" rx="5" fill="#121620" stroke="#3a3020" stroke-width="1" />
      <text x="16" y="20" fill="#d4af37" font-size="11" class="st-title">ENGINEERING PRINCIPLES</text>
      <text x="16" y="35" fill="#f4f0eb" font-size="12.5" font-weight="600">Schema Integrity · Modularity · Scalability</text>
      <text x="360" y="28" text-anchor="end" fill="#a69c8c" font-size="11">Standard</text>
    </g>
  </g>
</svg>