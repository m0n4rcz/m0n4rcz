<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 85" width="100%" height="85">
  <defs>
    <linearGradient id="q2Bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181e28" />
      <stop offset="50%" stop-color="#12151e" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
    <filter id="q2Glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <style>
      .q-cinzel { font-family: 'Cinzel', 'Noto Serif SC', 'Songti SC', serif; }
      .q-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes runePulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #ffd700); }
      }
      .qRune { animation: runePulse 4s infinite ease-in-out; }
    </style>
  </defs>

  <rect x="5" y="5" width="940" height="75" rx="6" fill="url(#q2Bg)" stroke="#3a3020" stroke-width="1.2" filter="url(#q2Glow)" />
  
  <path d="M 15 25 L 15 15 L 25 15" stroke="#d4af37" stroke-width="1.4" fill="none" />
  <path d="M 935 25 L 935 15 L 925 15" stroke="#d4af37" stroke-width="1.4" fill="none" />
  <path d="M 15 60 L 15 70 L 25 70" stroke="#d4af37" stroke-width="1.4" fill="none" />
  <path d="M 935 60 L 935 70 L 925 70" stroke="#d4af37" stroke-width="1.4" fill="none" />

  <g transform="translate(48, 42)">
    <circle cx="0" cy="0" r="20" fill="#1e180f" stroke="#b89035" stroke-width="1.5" class="qRune" />
    <text x="0" y="5" text-anchor="middle" fill="#ffd700" font-size="14" font-weight="bold" class="q-cinzel">貳</text>
  </g>

  <g transform="translate(85, 33)" class="q-cinzel">
    <text x="0" y="0" fill="#d4af37" font-size="11" letter-spacing="3" font-weight="600">
      QUEST II · FULLSTACK RETAIL PLATFORM
    </text>
    <text x="0" y="24" fill="#f4f0eb" font-size="17" font-weight="700" letter-spacing="1">
      EziSALE &#8212; Point of Sale &amp; Inventory Engine
    </text>
  </g>

  <g transform="translate(805, 27)" class="q-sans">
    <rect width="115" height="30" rx="4" fill="#1f2633" stroke="#3d3322" stroke-width="1" />
    <text x="57" y="19" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="600">ENTERPRISE POS</text>
  </g>
</svg>