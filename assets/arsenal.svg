<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151922" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>

    <linearGradient id="cardHeaderGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#ffe699" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <style>
      .a-title {
        font-family: 'Cinzel', 'Noto Serif SC', 'Songti SC', 'STSong', serif;
      }
      .a-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .pill {
        fill: #1a1e28;
        stroke: #3d3322;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- CARD 1: PROGRAMMING LANGUAGES -->
  <g transform="translate(30, 20)" filter="url(#cardGlow)">
    <rect width="455" height="210" rx="8" fill="url(#cardBgGrad)" stroke="#b89035" stroke-width="1.2" />
    <path d="M 8 20 L 8 8 L 20 8" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 447 20 L 447 8 L 435 8" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 8 190 L 8 202 L 20 202" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 447 190 L 447 202 L 435 202" stroke="#ffd700" stroke-width="1.5" fill="none" />
    
    <text x="30" y="38" fill="url(#cardHeaderGold)" font-size="14.5" font-weight="700" letter-spacing="2" class="a-title">
      I · PROGRAMMING LANGUAGES
    </text>
    <text x="30" y="58" fill="#9b917f" font-size="11.5" class="a-body">
      Core Execution &amp; Algorithmic Development
    </text>
    <line x1="30" y1="70" x2="425" y2="70" stroke="#3a3020" stroke-width="1" />

    <g transform="translate(30, 85)">
      <rect class="pill" width="85" height="32" rx="4" />
      <text x="42" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12.5" font-weight="600" class="a-body">Python</text>
    </g>
    <g transform="translate(125, 85)">
      <rect class="pill" width="80" height="32" rx="4" />
      <text x="40" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12.5" font-weight="600" class="a-body">Java</text>
    </g>
    <g transform="translate(215, 85)">
      <rect class="pill" width="75" height="32" rx="4" />
      <text x="37" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12.5" font-weight="600" class="a-body">SQL</text>
    </g>
    <g transform="translate(300, 85)">
      <rect class="pill" width="85" height="32" rx="4" />
      <text x="42" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12.5" font-weight="600" class="a-body">C / C++</text>
    </g>
    <g transform="translate(30, 127)">
      <rect class="pill" width="105" height="32" rx="4" />
      <text x="52" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12.5" font-weight="600" class="a-body">JavaScript</text>
    </g>
    <g transform="translate(145, 127)">
      <rect class="pill" width="105" height="32" rx="4" />
      <text x="52" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12.5" font-weight="600" class="a-body">TypeScript</text>
    </g>

    <text x="30" y="185" fill="#a89d8c" font-size="11.5" class="a-body">
      Focus: OOP architectures, concurrent threads &amp; data structures
    </text>
  </g>

  <!-- CARD 2: DATA & PERSISTENCE -->
  <g transform="translate(515, 20)" filter="url(#cardGlow)">
    <rect width="455" height="210" rx="8" fill="url(#cardBgGrad)" stroke="#b89035" stroke-width="1.2" />
    <path d="M 8 20 L 8 8 L 20 8" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 447 20 L 447 8 L 435 8" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 8 190 L 8 202 L 20 202" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 447 190 L 447 202 L 435 202" stroke="#ffd700" stroke-width="1.5" fill="none" />
    
    <text x="30" y="38" fill="url(#cardHeaderGold)" font-size="14.5" font-weight="700" letter-spacing="2" class="a-title">
