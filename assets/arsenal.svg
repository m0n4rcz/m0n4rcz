    </text>
    <text x="30" y="58" fill="#9b917f" font-size="11.5" class="a-body">
      Databases, Storage Models &amp; Analytical Pipelines
    </text>
    <line x1="30" y1="70" x2="425" y2="70" stroke="#3a3020" stroke-width="1" />

    <g transform="translate(30, 85)">
      <rect class="pill" width="105" height="32" rx="4" />
      <text x="52" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">PostgreSQL</text>
    </g>
    <g transform="translate(145, 85)">
      <rect class="pill" width="85" height="32" rx="4" />
      <text x="42" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">MySQL</text>
    </g>
    <g transform="translate(240, 85)">
      <rect class="pill" width="80" height="32" rx="4" />
      <text x="40" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Redis</text>
    </g>
    <g transform="translate(330, 85)">
      <rect class="pill" width="85" height="32" rx="4" />
      <text x="42" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Pandas</text>
    </g>
    <g transform="translate(30, 127)">
      <rect class="pill" width="115" height="32" rx="4" />
      <text x="57" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">NumPy / ETL</text>
    </g>
    <g transform="translate(155, 127)">
      <rect class="pill" width="125" height="32" rx="4" />
      <text x="62" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Query Tuning</text>
    </g>

    <text x="30" y="185" fill="#a89d8c" font-size="11.5" class="a-body">
      Focus: Relational modeling, indexing strategies &amp; batch processing
    </text>
  </g>

  <!-- CARD 3: INFRASTRUCTURE & TOOLS -->
  <g transform="translate(30, 250)" filter="url(#cardGlow)">
    <rect width="455" height="210" rx="8" fill="url(#cardBgGrad)" stroke="#b89035" stroke-width="1.2" />
    <path d="M 8 20 L 8 8 L 20 8" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 447 20 L 447 8 L 435 8" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 8 190 L 8 202 L 20 202" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 447 190 L 447 202 L 435 202" stroke="#ffd700" stroke-width="1.5" fill="none" />
    
    <text x="30" y="38" fill="url(#cardHeaderGold)" font-size="14.5" font-weight="700" letter-spacing="2" class="a-title">
      III · INFRASTRUCTURE &amp; TOOLS
    </text>
    <text x="30" y="58" fill="#9b917f" font-size="11.5" class="a-body">
      Environments, Containerization &amp; Version Control
    </text>
    <line x1="30" y1="70" x2="425" y2="70" stroke="#3a3020" stroke-width="1" />

    <g transform="translate(30, 85)">
      <rect class="pill" width="85" height="32" rx="4" />
      <text x="42" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Docker</text>
    </g>
    <g transform="translate(125, 85)">
      <rect class="pill" width="70" height="32" rx="4" />
      <text x="35" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Git</text>
    </g>
    <g transform="translate(205, 85)">
      <rect class="pill" width="85" height="32" rx="4" />
      <text x="42" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Linux</text>
    </g>
    <g transform="translate(300, 85)">
      <rect class="pill" width="85" height="32" rx="4" />
      <text x="42" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Bash / Sh</text>
    </g>
    <g transform="translate(30, 127)">
      <rect class="pill" width="105" height="32" rx="4" />
      <text x="52" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Postman</text>
    </g>
    <g transform="translate(145, 127)">
      <rect class="pill" width="115" height="32" rx="4" />
      <text x="57" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">VS Code / IDE</text>
    </g>

    <text x="30" y="185" fill="#a89d8c" font-size="11.5" class="a-body">
      Focus: Reproducible environments, CI workflows &amp; POSIX CLI
    </text>
  </g>

  <!-- CARD 4: BACKEND & FRAMEWORKS -->
  <g transform="translate(515, 250)" filter="url(#cardGlow)">
    <rect width="455" height="210" rx="8" fill="url(#cardBgGrad)" stroke="#b89035" stroke-width="1.2" />
    <path d="M 8 20 L 8 8 L 20 8" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 447 20 L 447 8 L 435 8" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 8 190 L 8 202 L 20 202" stroke="#ffd700" stroke-width="1.5" fill="none" />
    <path d="M 447 190 L 447 202 L 435 202" stroke="#ffd700" stroke-width="1.5" fill="none" />
    
    <text x="30" y="38" fill="url(#cardHeaderGold)" font-size="14.5" font-weight="700" letter-spacing="2" class="a-title">
      IV · BACKEND ARCHITECTURE
    </text>
    <text x="30" y="58" fill="#9b917f" font-size="11.5" class="a-body">
      Backend Frameworks, Services &amp; RESTful APIs
    </text>
    <line x1="30" y1="70" x2="425" y2="70" stroke="#3a3020" stroke-width="1" />

    <g transform="translate(30, 85)">
      <rect class="pill" width="115" height="32" rx="4" />
      <text x="57" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Spring Boot</text>
    </g>
    <g transform="translate(155, 85)">
      <rect class="pill" width="95" height="32" rx="4" />
      <text x="47" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">FastAPI</text>
    </g>
    <g transform="translate(260, 85)">
      <rect class="pill" width="105" height="32" rx="4" />
      <text x="52" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">Node / Express</text>
    </g>
    <g transform="translate(30, 127)">
      <rect class="pill" width="105" height="32" rx="4" />
      <text x="52" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">RESTful APIs</text>
    </g>
    <g transform="translate(145, 127)">
      <rect class="pill" width="125" height="32" rx="4" />
      <text x="62" y="21" text-anchor="middle" fill="#f4f0eb" font-size="12" font-weight="600" class="a-body">System Design</text>
    </g>

    <text x="30" y="185" fill="#a89d8c" font-size="11.5" class="a-body">
      Focus: Clean microservice boundaries, authentication &amp; endpoint scaling
    </text>
  </g>
</svg>