<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="100%" height="24">
  <defs>
    <linearGradient id="bronzeHairlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0d13" stop-opacity="0" />
      <stop offset="25%" stop-color="#d8ba78" stop-opacity="0.25" />
      <stop offset="48%" stop-color="#d8ba78" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f4f1ea" stop-opacity="0.95" />
      <stop offset="52%" stop-color="#d8ba78" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#d8ba78" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a0d13" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes dividerBreathe {
        0%, 100% { opacity: 0.50; }
        50% { opacity: 0.85; }
      }
      .anim-divider { animation: dividerBreathe 12s infinite ease-in-out; }
    </style>
  </defs>

  <g class="anim-divider" transform="translate(400, 12)">
    <!-- Tapering bronze hairline -->
    <line x1="-360" y1="0" x2="360" y2="0" stroke="url(#bronzeHairlineGrad)" stroke-width="1" />
    
    <!-- Delicate central antique bronze motif -->
    <polygon points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="#d8ba78" />
    <circle cx="-18" cy="0" r="1" fill="#d8ba78" opacity="0.6" />
    <circle cx="18" cy="0" r="1" fill="#d8ba78" opacity="0.6" />
  </g>
</svg>
